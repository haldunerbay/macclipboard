name: Release

# Push a version tag (git tag v1.2.0 && git push origin v1.2.0) to publish a release with the DMG.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    name: Build the DMG and publish the release
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: swift test

      # Apple silicon and Intel in one app, signed ad hoc (no Developer ID yet, so not notarized).
      - name: Build the DMG
        run: make dmg VERSION="${GITHUB_REF_NAME#v}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/ClipHistory-*.dmg \
            --title "Clip History ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
